name: rcr_mobile
description: Application mobile du Rassemblement des Chrétiens Républicains (adhésion, cotisation, dons).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  intl: any
  path_provider: ^2.1.5
  open_filex: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
