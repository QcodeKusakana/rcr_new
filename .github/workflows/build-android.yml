# Compile l'APK Android de l'application RCR dans le cloud GitHub (rien à installer sur votre PC).
# Utilisation : onglet « Actions » > « Build Android APK » > « Run workflow ».
# Résultat : fichier « rcr-apk » (rcr.apk) à télécharger en bas de la page de l'exécution, section « Artifacts ».
#
# Signature : FACULTATIVE. Si les 4 secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD existent et sont valides, l'APK est signé avec votre clé (mises à jour installables).
# Sinon la compilation continue avec la clé de test (l'APK s'installe, mais il faut le désinstaller avant chaque nouvelle version).
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "release = APK de production ; debug = APK de test"
        type: choice
        options: [release, debug]
        default: release
  push:
    paths: ["mobile_app/**", ".github/workflows/build-android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les dossiers android/ et ios/ puis appliquer la configuration RCR
        run: bash tool/setup_platforms.sh

      - name: Signature (facultative) avec votre clé RCR
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::notice title=Signature::Clé RCR non configurée : l'APK sera signé avec la clé de test (désinstallez l'ancienne version avant d'installer)."
            exit 0
          fi
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > android/app/rcr-release.jks || true
          if keytool -list -keystore android/app/rcr-release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" "$PWD/android/app/rcr-release.jks" > android/key.properties
            echo "::notice title=Signature::APK signé avec la clé RCR."
          else
            rm -f android/app/rcr-release.jks
            echo "::warning title=Signature::Secrets présents mais clé illisible (mot de passe, alias ou contenu incorrect) : clé de test utilisée à la place."
          fi

      - name: Analyse du code (informative)
        shell: bash
        run: flutter analyze 2>&1 | tee /tmp/analyze.log || true

      - name: Compiler l'APK
        env:
          API_BASE: ${{ vars.API_BASE || 'https://rcr.cd/api/v1' }}
          MODE: ${{ github.event.inputs.mode || 'release' }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --$MODE --build-number="$RUN_NUMBER" --target-platform android-arm,android-arm64 --dart-define=API_BASE="$API_BASE" 2>&1 | tee /tmp/build.log

      - name: Diagnostic en cas d'échec (erreurs lisibles dans les annotations)
        if: failure()
        shell: bash
        run: |
          for f in /tmp/analyze.log /tmp/build.log; do
            [ -f "$f" ] || continue
            grep -nE "error •|^e: |Error:|FAILURE|What went wrong|Execution failed|Could not|minSdk|AAPT|resource |Duplicate|Unresolved" "$f" | head -12 | while IFS= read -r l; do
              echo "::error title=Diagnostic $(basename $f)::$(printf '%s' "$l" | cut -c1-400 | tr -d '\r' | sed 's/%/%25/g')"
            done
          done
          echo "::notice title=Fin du journal::$(tail -n 8 /tmp/build.log 2>/dev/null | tr '\n' ' ' | cut -c1-600 | sed 's/%/%25/g')"

      - name: Préparer le fichier à télécharger
        shell: bash
        run: |
          APK=$(ls build/app/outputs/flutter-apk/app-*.apk | head -1)
          cp "$APK" build/app/outputs/flutter-apk/rcr.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: rcr-apk
          path: mobile_app/build/app/outputs/flutter-apk/rcr.apk
          retention-days: 30
