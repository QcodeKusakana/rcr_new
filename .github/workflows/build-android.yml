# Compile l'APK Android RCR (dossier rcr_android). Aucun secret requis.
# Utilisation : onglet « Actions » > « Build Android APK » > « Run workflow ».
# Résultat : « rcr-apk » (rcr.apk) en bas de la page de l'exécution, section « Artifacts ».
# En cas d'échec : les erreurs sont dans « Annotations » (haut de page) et dans l'artefact « journal-build ».
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths: ["rcr_android/**", ".github/workflows/build-android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rcr_android
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 1. Préparer le projet Android
        run: |
          set -o pipefail
          bash tool/preparer_android.sh 2>&1 | tee /tmp/1-preparer.log

      - name: 2. Télécharger les dépendances
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/2-pub.log

      - name: 3. Vérifier le code (informatif)
        run: flutter analyze 2>&1 | tee /tmp/3-analyze.log || true

      - name: 4. Compiler l'APK
        env:
          API_BASE: ${{ vars.API_BASE || 'https://rcr.cd/api/v1' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          flutter build apk --release --build-number="$RUN_NUMBER" --dart-define=API_BASE="$API_BASE" 2>&1 | tee /tmp/4-build.log

      - name: Diagnostic (si échec)
        if: failure()
        run: |
          for f in /tmp/1-preparer.log /tmp/2-pub.log /tmp/3-analyze.log /tmp/4-build.log; do
            [ -f "$f" ] || continue
            grep -nE "error •|^e: |Error:|error:|FAILURE|What went wrong|Execution failed|Could not|minSdk|AAPT|Duplicate|Unresolved|version solving|Because " "$f" | head -10 | while IFS= read -r l; do
              echo "::error title=$(basename $f)::$(printf '%s' "$l" | cut -c1-380 | tr -d '\r' | sed 's/%/%25/g')"
            done
          done

      - name: Journaux (toujours conservés)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-build
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Préparer rcr.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/rcr.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: rcr-apk
          path: rcr_android/build/app/outputs/flutter-apk/rcr.apk
          retention-days: 30
